<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#007bff">
    <link rel="manifest" href="../manifest.json">
    <title>Connexion | SOS Artisan</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <header id="messi">
        <a href="index.html" aria-label="Retour à l'accueil">
            <img src="../images/IMG_E1718.JPG" alt="SOS Artisan" width="80">
        </a>
        <nav id="menu">
            <a href="index.html" class="inscription-link">Accueil</a>
            <a href="inscription.html" class="inscription-link">Créer un compte</a>
        </nav>
    </header>

    <main class="inscription-page">
        <h1>Connexion</h1>
        <p>Connectez-vous avec le numéro de téléphone utilisé lors de votre inscription.</p>
        <form id="formulaireConnexion">
            <div class="inscription-grid">
                <label class="full-width">
                    Téléphone
                    <input type="tel" name="telephone" autocomplete="tel" required>
                </label>
                <label class="full-width">
                    Mot de passe
                    <input type="password" name="motDePasse" autocomplete="current-password" required>
                </label>
            </div>
            <button type="submit">Se connecter</button>
            <p id="messageConnexion" role="status" aria-live="polite"></p>
        </form>
        <p class="retour-accueil">Pas encore de compte ? <a href="inscription.html">Créer un compte</a></p>
    </main>

    <button id="boutonInstallerApplication" type="button" hidden>Installer l'application</button>
    <script src="../js/app.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/connexion.js"></script>
</body>
</html>
